<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Login – Deckforge</title>

    <!-- Brug almindelige relative stier -->
    <link rel="stylesheet" href="deckforge.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">
    <h1>Login</h1>
    <p>Log ind for at få adgang til dine kort, decks og events</p>
</section>

<section class="content container center-text">

    <div class="login-box">
        <h2>Log ind</h2>

        <form action="#" method="post">

            <div class="form-group">
                <label>Email</label>
                <input type="text" name="email" class="input-field">
            </div>

            <div class="form-group">
                <label>Kode</label>
                <input type="password" name="password" class="input-field">
            </div>

            <button class="btn" type="submit">Login</button>

            <p class="error-text">Forkert email eller kode</p>
        </form>

        <p class="register-text">
            Har du ikke en konto?
            <a href="register.html" class="link">Registrer dig her</a>
        </p>
    </div>

</section>

</body>
</html>
