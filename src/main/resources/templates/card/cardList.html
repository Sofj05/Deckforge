<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vælg kort – Deckforge</title>

    <!-- Style stien til hjemmesiden -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>
<header th:replace="fragments/header :: header"></header>

<section class="hero">
    <h1>Tilføj kort til din samling</h1>
    <p>Vælg antal af hvert kort</p>
</section>

<section class="content container">

    <div class="card-container">

        <!-- LOOP ALLE KORT -->
        <div class="card-item"
             th:each="card : ${allCards}"
             th:attr="data-mana=${card.mana},
                      data-set=${card.nameOfSet},
                      data-rarity=${card.rarity},
                      data-type=${card.cardtype},
                      data-abilitie=${card.ability}">

            <!-- HEADER -->
            <div class="card-header">
                <h3 class="card-name" th:text="${card.name}"></h3>
            </div>

            <!-- BILLEDE -->
            <div class="card-image">
                <img th:src="@{'/uploads/' + ${card.image}}" th:alt="${card.name}">
            </div>

            <!-- TYPE -->
            <div class="card-type" th:text="${card.cardtype}"></div>

            <!-- RULES -->
            <div class="card-rules">
                <p th:text="${card.ruleText}"></p>
            </div>

            <!-- BUNDLINJE -->
            <div class="card-bottom">
                <div class="rarity-box" th:text="${card.rarity.substring(0,1)}"></div>
                <div class="pt-box">—</div>
            </div>

            <!-- + / – vælger -->
            <div class="choose-controls">
                <button type="button" onclick="changeAmount(this, -1, event)">–</button>
                <input type="number" value="0" min="0" max="999" readonly>
                <button type="button" onclick="changeAmount(this, +1, event)">+</button>
            </div>

            <!-- TILFØJ TIL SAMLING -->
            <form th:action="@{/user/addCard}" method="post">
                <input type="hidden" name="cardId" th:value="${card.id}">
                <input type="hidden" name="amount" value="0">
                <button class="btn-add" type="submit">Tilføj til samling</button>
            </form>

        </div>
    </div>

    <!---TILFØJ KNAP SOM LOADER 9 KORT--->
    <button id="loadMoreBtn" class="btn-add" style="margin: 20px auto; display: block;">
        Load flere kort
    </button>

</section>

<!-- MODAL -->
<div id="card-modal" class="modal">
    <div class="modal-content">

        <h2 id="modal-title"></h2>
        <img id="modal-image" src="" alt="">

        <p><strong>Type:</strong> <span id="modal-type"></span></p>
        <p><strong>Mana:</strong> <span id="modal-mana"></span></p>
        <p><strong>Sæt:</strong> <span id="modal-set"></span></p>
        <p><strong>Rarity:</strong> <span id="modal-rarity"></span></p>
        <p><strong>Abilities:</strong> <span id="modal-abilitie"></span></p>

    </div>
</div>

<script>
    // ---------------------------
    // LOAD MORE – vis 9 kort ad gangen
    // ---------------------------
    const cards = Array.from(document.querySelectorAll(".card-item"));
    let visibleCount = 9;

    // Skjul alle kort først
    cards.forEach(c => c.style.display = "none");

    // Vis de første 9
    function showCards() {
        for (let i = 0; i < visibleCount && i < cards.length; i++) {
            cards[i].style.display = "block";
        }

        // Skjul knappen hvis der ikke er flere kort
        if (visibleCount >= cards.length) {
            document.getElementById("loadMoreBtn").style.display = "none";
        }
    }

    showCards();

    // Når man klikker "Load flere"
    document.getElementById("loadMoreBtn").addEventListener("click", () => {
        visibleCount += 9;
        showCards();
    });

    // ---------------------------
    // + / – funktion
    // ---------------------------
    function changeAmount(button, delta, event) {
        if (event) {
            event.stopPropagation(); // vigtigt: forhindrer modal-click
        }

        const input = button.parentElement.querySelector("input");
        let value = parseInt(input.value) + delta;

        if (value < 0) value = 0;
        if (value > 999) value = 999;

        input.value = value;

        const form = button.closest(".card-item").querySelector("form");
        form.querySelector("input[name='amount']").value = value;
    }

    // ---------------------------
    // Mana converter
    // ---------------------------
    function convertMana(cost) {
        if (!cost) return "";
        let html = "";
        const matches = cost.match(/\{(.*?)\}/g);
        if (!matches) return cost;

        matches.forEach(symbol => {
            const value = symbol.replace("{", "").replace("}", "");
            if (!isNaN(value)) {
                html += `<span class="mana-symbol mana-num">${value}</span>`;
            } else {
                html += `<span class="mana-symbol mana-${value}">${value}</span>`;
            }
        });
        return html;
    }

    // ---------------------------
    // Rarity color converter
    // ---------------------------
    function rarityColor(r) {
        if (!r) return "";
        const key = r.toLowerCase();
        return `<span class="rarity-${key}">${r}</span>`;
    }

    // ---------------------------
    // Ability formatter
    // ---------------------------
    function formatAbilities(text) {
        if (!text) return "";
        const abilities = text.split("|");
        let html = "<ul>";
        abilities.forEach(a => html += `<li>${a.trim()}</li>`);
        html += "</ul>";
        return html;
    }

    // ---------------------------
    // Modal åbner
    // ---------------------------
    document.querySelectorAll('.card-item').forEach(card => {
        card.addEventListener('click', () => {

            document.getElementById('modal-title').innerText =
                card.querySelector('.card-name').innerText;

            document.getElementById('modal-image').src =
                card.querySelector('.card-image img').src;

            document.getElementById('modal-type').innerText = card.dataset.type;
            document.getElementById('modal-mana').innerHTML = convertMana(card.dataset.mana);
            document.getElementById('modal-set').innerText = card.dataset.set;
            document.getElementById('modal-rarity').innerHTML = rarityColor(card.dataset.rarity);
            document.getElementById('modal-abilitie').innerHTML = formatAbilities(card.dataset.abilitie);

            document.getElementById('card-modal').style.display = 'flex';
        });
    });

    // ---------------------------
    // Modal når man tilføjer kort
    // ---------------------------
    document.querySelectorAll(".add-card-form").forEach(form => {
        form.addEventListener("submit", function(e) {
            e.preventDefault(); // stop form submission

            document.getElementById("add-modal").style.display = "flex";

            // Når man trykker OK → send form
            document.getElementById("closeAddModal").onclick = () => {
                document.getElementById("add-modal").style.display = "none";
                form.submit();
            };
        });
    });

    // ---------------------------
    // Modal lukker
    // ---------------------------
    document.getElementById("add-modal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) {
            e.currentTarget.style.display = "none";
        }
    });


</script>

<!--- MODAL POP-UP (GENNEMFØRT TILFØJELSE AF KORT TIL SAMLING)--->
<div id="add-modal" class="modal">
    <div class="modal-content" style="max-width: 300px; text-align: center;">
        <h3>Kort tilføjet!</h3>
        <p>Dit kort er nu tilføjet til samlingen.</p>
        <button id="closeAddModal" class="btn-add">OK</button>
    </div>
</div>

</body>
</html>
