<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Opret Nyt Kort</title>

    <!-- Style stien til hjemmesiden -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<header th:replace="fragments/header :: header"></header>


<section class="hero">
    <h1>Opret et nyt kort</h1>
    <p>Tilføj et nyt kort til din samling</p>
</section>

<div class="create-card-container">

    <!-- FORM UDEN BACKEND -->
    <form class="create-card-form" onsubmit="event.preventDefault(); showSuccess();">

        <!-- NAVN -->
        <label for="card_name">Kortnavn</label>
        <input type="text" id="card_name" name="card_name" required>

        <!-- CARD TYPE -->
        <label for="cardType">Korttype</label>
        <select id="cardType" name="cardType" required>
            <option value="CREATURE">Creature</option>
            <option value="LAND">Land</option>
            <option value="INSTANT">Instant</option>
            <option value="SORCERY">Sorcery</option>
            <option value="ARTIFACT">Artifact</option>
            <option value="ENCHANTMENT">Enchantment</option>
            <option value="PLANESWALKER">Planeswalker</option>
        </select>

        <!-- MANA -->
        <label for="mana">Mana</label>
        <select id="mana" name="mana" required>
            <option value="WHITE">White</option>
            <option value="BLUE">Blue</option>
            <option value="BLACK">Black</option>
            <option value="RED">Red</option>
            <option value="GREEN">Green</option>
            <option value="NEUTRAL">Neutral / Colorless</option>
        </select>

        <!-- SET NAVN -->
        <label for="nameOfSet">Sæt</label>
        <input type="text" id="nameOfSet" name="nameOfSet" required>

        <!-- RARITY -->
        <label for="rarity">Rarity</label>
        <select id="rarity" name="rarity" required>
            <option value="COMMON">Common</option>
            <option value="UNCOMMON">Uncommon</option>
            <option value="RARE">Rare</option>
            <option value="MYTHICRARE">Mythic Rare</option>
        </select>

        <!-- RULE TEXT -->
        <label for="ruleText">Rules</label>
        <textarea id="ruleText" name="ruleText" rows="5"
                  placeholder="Flying, lifelink | Pay 7 life: Draw seven cards."></textarea>

        <!-- ABILITY -->
        <label for="ability">Abilities</label>
        <input type="text" id="ability" name="ability" placeholder="Flying, Lifelink" required>

        <!-- BILLEDE -->
        <label for="image">Kortbillede</label>
        <input type="file" id="image" name="image" accept="image/*" required>

        <!-- SUBMIT -->
        <button type="submit" class="btn-create">Opret kort</button>

    </form>

    <!-- SUCCESS BESKED -->
    <p id="successMessage" style="display:none; margin-top:20px; color:green; font-weight:bold;">
        Kortet er oprettet (lokalt) ✔
    </p>

</div>

<script>
    function showSuccess() {
        document.getElementById("successMessage").style.display = "block";
    }
</script>

</body>
</html>
