<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Opret Event</title>

    <link rel="stylesheet" href="/deckforge.css">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<header th:replace="fragments/header :: header"></header>



<section class="hero">
    <h1>Opret Event</h1>
    <p>Lav et nyt event til Deckforge</p>
</section>

<section class="content container">

    <form th:action="@{/event/createEventUser}" method="post" th:object="${event}">

        <div class="form-group">
            <label for="name">Eventnavn</label>
            <input type="text" id="name" th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="date">Dato</label>
            <input type="date" id="date" th:field="*{date}" required>
        </div>

        <div class="form-group">
            <label for="time">Tid</label>
            <input type="time" id="time" th:field="*{time}" required>
        </div>

        <div class="form-group">
            <label for="location">Lokation</label>
            <input type="text" id="location" th:field="*{location}"
                   placeholder="Fx. København, Odense" required>
        </div>

        <div class="form-group">
            <label for="maxParticipants">Maks deltagere</label>
            <input type="number" id="maxParticipants"
                   th:field="*{maxParticipants}" min="1" required>
        </div>

        <div class="form-group">
            <label for="format">Format</label>
            <select id="format" th:field="*{format}">
                <option th:value="${null}">- Vælg format -</option>
                <option th:each="f : ${format}"
                        th:value="${f}"
                        th:text="${f.description}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="rules">Regler / Beskrivelse</label>
            <textarea id="rules"
                      th:field="*{rules}"
                      rows="5"></textarea>
        </div>

        <button type="submit" class="btn">
            Opret Event
        </button>

    </form>

    <p th:if="${error != null}"
       th:text="${error}"
       style="color:orange;">
    </p>

</section>


</body>
</html>
