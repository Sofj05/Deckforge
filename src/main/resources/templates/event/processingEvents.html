<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Events der behandles</title>

    <link rel="stylesheet" href="/deckforge.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header">
    <div class="container nav-container">
        <a href="#" class="logo">
            <img src="Logo_Deckforge2.png" class="logo-icon" alt="Deckforge logo">
        </a>

        <nav class="nav">
            <ul class="nav-list">
                <li><a th:href="@{/user/profile}">Din Profil</a></li>
                <li><a th:href="@{/event/ongoingEvents}">Events</a></li>
                <li><a href="#">Alle Kort</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="hero">
    <h1>Overblik over events</h1>
    <p>Liste over events der venter på at blive behandlet</p>

</section>

<section class="content container">

    <h1>Events der afventer behandling</h1>

    <div class="event-card-container">

        <div class="event-card"
             th:each="event : ${events}">

            <h3 th:text="${event.name}"></h3>

            <p>
                <strong>Arrangør:</strong>
                <span th:text="${event.organizer.username}"></span>
            </p>

            <p>
                <strong>Dato:</strong>
                <span th:text="${event.date}"></span>
            </p>

            <p>
                <strong>Tid:</strong>
                <span th:text="${event.time}"></span>
            </p>

            <div class="event-card-actions">

                <!-- INFO -->
                <a th:href="@{/event/showEvent/{id}(id=${event.id})}"
                   class="btn small">
                    Se info
                </a>

                <!-- ACCEPT -->
                <form th:action="@{/event/approve/{id}(id=${event.id})}"
                      method="post">
                    <input type="hidden"
                           name="decision"
                           value="yes">
                    <button type="submit"
                            class="btn small"
                            onclick="return confirm('Godkend dette event?')">
                        Acceptér
                    </button>
                </form>

                <!-- AFVIS -->
                <form th:action="@{/event/approve/{id}(id=${event.id})}"
                      method="post">
                    <input type="hidden"
                           name="decision"
                           value="no">
                    <button type="submit"
                            class="btn small danger"
                            onclick="return confirm('Afvis dette event?')">
                        Afvis
                    </button>
                </form>

                <p th:if="${error != null and errorEventId == event.id}"
                   th:text="${error}"
                   style="color:orange;">
                </p>

            </div>
        </div>
    </div>
</section>


</body>
</html>
