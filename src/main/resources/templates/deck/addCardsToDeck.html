<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tilføj kort til deck - Deckforge</title>

    <!-- Style stien til hjemmesiden -->
    <link rel="stylesheet" href="/style.css">

</head>
<body>
<header th:replace="fragments/header :: header"></header>


<section class="content container">
    <a th:href="@{/decks/{id}(id=${deck.id})}" class="btn">← Tilbage til deck</a>
    <h1 style="margin-top: 20px;" th:text="'Tilføj kort til: ' + ${deck.name}">Tilføj kort til deck</h1>
    <p style="color: #666;">Vælg antal kort du ønsker at tilføje til dit deck</p>

    <section class="card-container">
        <!-- LOOP GENNEM BRUGERENS KORT -->
        <article class="card-item" th:each="card : ${userCards}">
            <header class="card-header">
                <h3 class="card-name" th:text="${card.name}">Kort navn</h3>
            </header>

            <figure class="card-image">
                <img th:src="${card.imageUrl}" th:alt="${card.name}">
            </figure>

            <div class="card-bottom">
                <span class="card-status owned">
                    Ejet
                </span>
                <span class="card-status quantity-owned">
                    <span th:text="${card.quantity}"></span> stk i samling.
                </span>
            </div>

            <!-- FORM TIL AT TILFØJE KORT -->
            <form th:action="@{/decks/{deckId}/addCards(deckId=${deck.id})}" method="post">
                <div class="quantity-controls">
                    <button type="button" class="qty-btn-minus">–</button>
                    <input type="number" name="quantity" value="1" min="1" class="qty-input" readonly>
                    <button type="button" class="qty-btn-plus">+</button>
                </div>
                <input type="hidden" name="id" th:value="${card.id}">
                <button type="submit" class="btn-add-card">Tilføj til deck</button>
            </form>
        </article>
    </section>
</section>

<script>
    // Håndter quantity controls
    document.querySelectorAll('.card-item').forEach(cardItem => {
        const minusBtn = cardItem.querySelector('.qty-btn-minus');
        const plusBtn = cardItem.querySelector('.qty-btn-plus');
        const input = cardItem.querySelector('.qty-input');

        minusBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let value = parseInt(input.value);
            if (value > 1) {
                input.value = value - 1;
            }
        });

        plusBtn.addEventListener('click', (e) => {
            e.preventDefault();
            let value = parseInt(input.value);
            input.value = value + 1;
        });
    });
</script>

</body>
</html>
