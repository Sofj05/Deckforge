<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${deck.name} + ' — Deck'">Deck</title>

  <!-- Style stien til hjemmesiden -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header th:replace="fragments/header :: header"></header>


<section class="content container">
  <a th:href="@{/user/profile}" class="btn">Back to profile</a>
  <h1 th:text="${deck.name}">Deck name</h1>
  <p><strong>Format:</strong> <span th:text="${deck.format}">FORMAT</span></p>
  <p><strong>Card count:</strong>
    <span th:text="${totalCards}">0</span>
  </p>
  <a th:href="@{/decks/{id}/addCards(id=${deck.id})}" class="btn">
    + Tilføj kort til deck
  </a>


  <section class="card-container">

    <article class="card-item" th:each="card : ${cards}">

      <header class="card-header">
        <h3 class="card-name" th:text="${card.name}">Card name</h3>
      </header>

      <figure class="card-image">
        <img th:src="${card.image}" th:alt="${card.name}">
      </figure>

      <div class="card-bottom">
        <span class="card-status owned">
          Ejet
        </span>
        <span class="card-status quantity-owned">
          <span th:text="${card.quantity}"></span> stk i deck.
        </span>
      </div>

      <form th:action="@{/decks/{deckId}/removeCard(deckId=${deck.id})}" method="post">
        <div class="quantity-controls">
          <button type="button" class="qty-btn-minus">–</button>
          <input type="number" name="quantity" value="1" min="1" class="qty-input" readonly>
          <button type="button" class="qty-btn-plus">+</button>
        </div>
        <input type="hidden" name="id" th:value="${card.id}">
        <button type="submit" class="btn-remove-card">Fjern fra deck</button>
      </form>

    </article>

  </section>
</section>

<script>
  document.querySelectorAll('.card-item').forEach(cardItem => {
    const minusBtn = cardItem.querySelector('.qty-btn-minus');
    const plusBtn = cardItem.querySelector('.qty-btn-plus');
    const input = cardItem.querySelector('.qty-input');

    minusBtn.addEventListener('click', (e) => {
      e.preventDefault();
      let value = parseInt(input.value);
      if (value > 1) {
        input.value = value - 1;
      }
    });

    plusBtn.addEventListener('click', (e) => {
      e.preventDefault();
      let value = parseInt(input.value);
      input.value = value + 1;
    });
  });
</script>

</body>
</html>
