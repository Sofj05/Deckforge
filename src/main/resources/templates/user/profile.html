DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deckforge – Profil</title>

    <!-- Deckforge tema -->
    <link rel="stylesheet" href="/deckforge.css">

    <!-- Magic-kort layout -->
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<!-- HERO -->
<section class="hero">
    <h1>Velkommen, <span th:text="${loggedInUser.username}"></span></h1>
    <p>Her kan du se og administrere dine oplysninger og dine kort</p>
</section>

<!-- PROFIL INFO -->
<section class="content container">
    <h2>Dine oplysninger</h2>

    <p><strong>Brugernavn:</strong> <span th:text="${loggedInUser.username}"></span></p>

    <form th:action="@{/users/update}" method="post">
        <button type="submit" class="btn">Rediger profil</button>
    </form>

    <a class="btn danger" th:href="@{/users/deleteConfirmation}">
        Slet min konto
    </a>


</section>
<!-- DINE Decks (DECK LAYOUT) -->
<section class="content container">
    <h1>Decks</h1>
    <div class="card-container">

        <!-- LOOP GENNEM DECKS -->
        <div class="deck-item"
             th:each="deck : ${decks}">
            <a th:href="@{/user/deck/{id}(id=${deck.id})}" class="deck-link">
                <div class="deck-header">
                    <h3 th:text="${deck.name}">Deck name</h3>
                </div>

                <div class="deck-meta">
                    <p><strong>Format:</strong> <span th:text="${deck.format}">FORMAT</span></p>
                    <p><strong>Cards:</strong>
                        <span th:text="${#lists.size(deck.cards) == 0 ? (deck.cardCount != null ? deck.cardCount : 0) : #lists.size(deck.cards)}">0</span>
                    </p>
                </div>
            </a>
        </div>

    </div>
</section>

<!-- DINE KORT (MAGIC-KORT LAYOUT) -->
<section class="content container">
    <h1>Dine kort</h1>

    <div class="card-container">


        <!-- LOOP GENNEM KORT -->
        <div class="card-item"
             th:each="card : ${cards}"
             th:attr="data-mana=${card.mana},
                      data-set=${card.nameOfSet},
                      data-rarity=${card.rarity},
                      data-type=${card.cardtype},
                      data-ability=${card.ability},
                      data-rule=${card.ruleText}">

            <!-- HEADER -->
            <div class="card-header">
                <h3 class="card-name" th:text="${card.name}"></h3>
            </div>

            <!-- BILLEDE -->
            <div class="card-image">
                <img th:src="${card.image}" th:alt="${card.name}">
            </div>

            <div class="card-bottom">
                <!-- STATUS -->
                <div class="card-status owned">
                    Ejet
                </div>
                <div class="card-status quantity-owned">
                    <span th:text="${card.quantity}"></span> stk.
                </div>
            </div>

        </div>

    </div>
</section>

<!-- MODAL -->
<div id="card-modal" class="modal">
    <div class="modal-content">

        <h2 id="modal-title"></h2>
        <img id="modal-image" src="" alt="">

        <p><strong>Type:</strong> <span id="modal-type"></span></p>
        <p><strong>Mana:</strong> <span id="modal-mana"></span></p>
        <p><strong>Set:</strong> <span id="modal-set"></span></p>
        <p><strong>Rarity:</strong> <span id="modal-rarity"></span></p>
        <p><strong>Abilities:</strong> <span id="modal-ability"></span></p>
        <p><strong>Rules:</strong> <span id="modal-rule"></span></p>

    </div>
</div>

<script>
    // ---------------------------
    // Mana converter
    // ---------------------------
    function convertMana(cost) {
        let html = "";
        const matches = cost.match(/\{(.*?)\}/g);
        if (!matches) return cost;

        matches.forEach(symbol => {
            const value = symbol.replace("{", "").replace("}", "");
            if (!isNaN(value)) {
                html += `<span class="mana-symbol mana-num">${value}</span>`;
            } else {
                html += `<span class="mana-symbol mana-${value}">${value}</span>`;
            }
        });
        return html;
    }

    // ---------------------------
    // Rarity color converter
    // ---------------------------
    function rarityColor(r) {
        const key = r.toLowerCase();
        return `<span class="rarity-${key}">${r}</span>`;
    }

    // ---------------------------
    // Ability formatter
    // ---------------------------
    function formatAbilities(text) {
        if (!text) return "";
        const abilities = text.split("|");
        let html = "<ul>";
        abilities.forEach(a => html += `<li>${a.trim()}</li>`);
        html += "</ul>";
        return html;
    }

    // ---------------------------
    // Ability formatter
    // ---------------------------
    function formatrules(text) {
        if (!text) return "";
        const rules = text.split("|")
let html = "";
        rules.forEach(a => html += `${a.trim()}</li>`);
        html += "</ul>";
        return html;
    }

    // ---------------------------
    // Card click handler
    // ---------------------------
    document.querySelectorAll('.card-item').forEach(card => {
        card.addEventListener('click', () => {

            document.getElementById('modal-title').innerText =
                card.querySelector('.card-name').innerText;

            document.getElementById('modal-image').src =
                card.querySelector('.card-image img').src;

            document.getElementById('modal-type').innerText = card.dataset.type;

            document.getElementById('modal-mana').innerHTML =
                convertMana(card.dataset.mana);

            document.getElementById('modal-set').innerText = card.dataset.set;

            document.getElementById('modal-rarity').innerHTML =
                rarityColor(card.dataset.rarity);

            document.getElementById('modal-ability').innerHTML =
                formatAbilities(card.dataset.ability);

            document.getElementById('modal-rule').innerHTML =
                formatrules(card.dataset.rule);

            document.getElementById('card-modal').style.display = 'flex';
        });
    });

    // ---------------------------
    // Close modal
    // ---------------------------
    document.getElementById('card-modal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            e.currentTarget.style.display = 'none';
        }
    });
</script>

</body>
</html>
